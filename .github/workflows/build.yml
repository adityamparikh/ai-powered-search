name: Build

# The full gate: `./gradlew build` compiles with ErrorProne and NullAway, checks Google Java
# Format (Spotless), runs every test except the billed rag-eval harness (including
# ArchitectureTest and the Testcontainers integration tests) and fails under the JaCoCo
# line-coverage floor. No API keys are set, on purpose: the live tests are gated on
# @EnabledIfEnvironmentVariable(matches = ".+"), so even a dummy key would switch them on and
# send real, failing model calls. The test profiles supply their own placeholder keys. The
# Solr-version matrix stays in hybrid-search-solr.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, test and check coverage
        run: ./gradlew build
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
