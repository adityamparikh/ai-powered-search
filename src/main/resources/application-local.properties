# Local development profile: --spring.profiles.active=local or SPRING_PROFILES_ACTIVE=local.
#
# Verbose logging. At DEBUG, SimpleLoggerAdvisor logs every full prompt (the question, the
# conversation history and the retrieved passages) and every response, and this application logs
# the raw search query and /ask question. That is customer content: use this profile only on a
# developer's machine, never on a shared or deployed environment or against real data.
logging.level.org.springframework.ai.chat.client.advisor=debug
logging.level.dev.aparikh.aipoweredsearch=debug
# Back to the framework's level: its WARNs (an empty response, an unsupported content block) quote
# the prompt, which is fine here and useful when debugging.
logging.level.org.springframework.ai.anthropic.AnthropicChatModel=warn

# Trace every request.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
