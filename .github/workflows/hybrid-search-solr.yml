name: Hybrid search on Solr

# Hybrid search relies on Solr's combined query (server-side RRF), available in Solr 10.1
# and 9.11. ci.yml's `verify` already runs every keyless test on the default image (Solr 10.1),
# so this workflow covers the other supported line, 9.11. No API keys are needed: the embedding
# and chat models are mocked.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solr:
    name: Solr ${{ matrix.solr }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        solr: ["9.11.0"]
    env:
      SOLR_TEST_IMAGE: solr:${{ matrix.solr }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Hybrid search tests
        run: >
          ./gradlew test
          --tests "dev.aparikh.aipoweredsearch.search.SolrHybridSearchIT"
          --tests "dev.aparikh.aipoweredsearch.search.SearchRepositoryTest"
          --tests "dev.aparikh.aipoweredsearch.search.SearchRepositoryIT"
