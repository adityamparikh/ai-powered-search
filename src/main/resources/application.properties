spring.application.name=ai-powered-search
spring.threads.virtual.enabled=true

# Solr Configuration
solr.url=http://localhost:8983/solr

# Spring AI Configuration - Anthropic (for chat)
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=${ANTHROPIC_CHAT_MODEL:claude-sonnet-5-5}
# Anthropic Prompt Caching Configuration
# Enable prompt caching to reduce costs and improve response times
# Caching can reduce costs by up to 90% and improve latency by up to 85%
spring.ai.anthropic.prompt-caching.enabled=${ANTHROPIC_PROMPT_CACHING_ENABLED:true}
spring.ai.anthropic.prompt-caching.strategy=${ANTHROPIC_PROMPT_CACHING_STRATEGY:SYSTEM_AND_TOOLS}
# Model that rewrites each question into a standalone query for retrieval (conversation-aware RAG)
search.rag.query-rewrite.model=${RAG_QUERY_REWRITE_MODEL:claude-haiku-4-5}

# RAG: optional decision-model screening of retrieved passages (off by default). A decision model
# (Spring AI's DecisionModel API) answers narrow questions about each passage (prompt injection?
# relevant? answer evidence?) and the ones that fail are dropped, before reranking. One call per
# passage, so it adds latency; calls run concurrently, at most max-concurrency at once.
# search.rag.decisions.enabled=false
# search.rag.decisions.provider=typesafe
# search.rag.decisions.max-concurrency=8
# Rerank with the decisions provider instead of Claude. It keeps the top-k passages, discarding only
# those scoring below the minimum (0 keeps all).
# search.rag.rerank.provider=claude
# search.rag.decisions.rerank.minimum-score=0.0
#
# The 'typesafe' provider is Spring AI's SystemOneDecisionModel on TypeSafe's hosted Jev, or a local model with the same API (Laya, Nimble)
# via spring.ai.typesafe.base-url and spring.ai.typesafe.model. The key comes from TYPESAFE_API_KEY; a
# local model needs only a placeholder. The TypeSafe starter activates whenever this property is present
# and not "false", and an empty key fails startup, so an unset variable resolves to "false" (TypeSafe
# stays off) rather than to an empty default. Tune latency with spring.ai.typesafe.timeout and
# spring.ai.typesafe.retry.total-timeout.
spring.ai.typesafe.api-key=${TYPESAFE_API_KEY:false}

# Spring AI Configuration - OpenAI (for embeddings)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1536

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/chatmemory
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Chat Memory Configuration
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.type=jdbc
spring.main.allow-bean-definition-overriding=true

# API versioning (Spring Framework 7 / Spring Boot 4).
# The version lives in path segment 1: /api/{version}/... -> "v1".
# SemanticApiVersionParser skips leading non-digits, so "v1" parses as 1.0.0 and the
# existing /api/v1/... URLs keep working unchanged.
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.default=v1


# Force Spring Boot to not use Jetty for REST clients
spring.http.clients.imperative.factory=simple

# Swagger UI / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# OpenTelemetry OTLP Configuration (for Grafana LGTM stack)
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step=10s
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.logging.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.tracing.sampling.probability=1.0

logging.level.org.springframework.ai.chat.client.advisor=debug
logging.level.dev.aparikh.aipoweredsearch=debug
