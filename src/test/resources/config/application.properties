# Applies to every test context. Boot loads classpath:/config/application.properties next to the
# main application.properties and merges them (it does not shadow it).
#
# Each distinct Spring context the suite caches keeps its own Hikari pool open against one shared
# Testcontainers Postgres (max_connections=200). Hikari's default is 10 per pool, so 20 contexts
# exhaust it ("FATAL: sorry, too many clients already") and the next context fails to start.
# application-test.properties had these caps, but only for the two classes that activate the
# "test" profile.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
