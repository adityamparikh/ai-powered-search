name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    env:
      # Secrets can't be read in a job-level `if`, so expose whether this one is set.
      HAS_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    permissions:
      contents: write  # Allow Claude to make code changes
      pull-requests: write  # Allow Claude to update PRs
      issues: write  # Allow Claude to comment on issues
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Skip when CLAUDE_CODE_OAUTH_TOKEN is not set
        if: env.HAS_CLAUDE_CODE_OAUTH_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so the @claude run is skipped."

      - name: Checkout repository
        if: env.HAS_CLAUDE_CODE_OAUTH_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Java
        if: env.HAS_CLAUDE_CODE_OAUTH_TOKEN == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Run Claude Code
        if: env.HAS_CLAUDE_CODE_OAUTH_TOKEN == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Custom context for Spring Boot application
          prompt: |
            You are working on ai-powered-search: a Spring Boot 4.1 / Java 25 application
            (Spring AI 2.0, SolrJ 10) that does keyword, vector and hybrid search over Apache
            Solr, with Anthropic Claude for query generation and answers and OpenAI for embeddings.
            Read CLAUDE.md first: it lists the build commands, the repository layout, the rules
            and traps, and the operations that need a human.
            - Prove your work with ./gradlew verify before you finish.
            - Never push to main. Commit to the branch this action created and open a pull request.
            - Never run ./gradlew ragEval or ./gradlew liveTest: they make billed model calls.

          # Claude args configured for Java/Spring Boot development
          claude_args: |
            --allowed-tools Bash(./gradlew:*) \
            --allowed-tools Bash(git:*) \
            --allowed-tools Bash(gh:*) \
            --allowed-tools Edit \
            --allowed-tools Read \
            --allowed-tools Write \
            --allowed-tools Glob \
            --allowed-tools Grep

